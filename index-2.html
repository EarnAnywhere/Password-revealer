<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Revealer (Totally Fake)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0d1117; color: #c9d1d9;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .card {
    width: min(92vw, 420px); padding: 24px; border-radius: 12px;
    background: #161b22; border: 1px solid #30363d;
  }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  .sub { font-size: .8rem; color: #8b949e; margin-bottom: 16px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: inherit; font: inherit;
  }
  button {
    margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 6px;
    background: #238636; color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .bar { height: 6px; background: #21262d; border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
  .bar div { height: 100%; width: 0; background: #2f81f7; transition: width .2s; }
  #log { margin-top: 12px; font-size: .78rem; color: #8b949e; min-height: 1.2em; }
  #result {
    margin-top: 14px; padding: 12px; border-radius: 6px; background: #0d1117;
    border: 1px dashed #f85149; color: #ff7b72; text-align: center;
    font-size: 1.1rem; display: none; word-break: break-all;
  }
  .note { margin-top: 16px; font-size: .72rem; color: #6e7681; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔓 Password Revealer 3000</h1>
    <div class="sub">Reveal any hidden password. (Not really.)</div>

    <input id="pw" type="password" placeholder="Paste or type a hidden password" autocomplete="off">
    <button id="go">Reveal Password</button>

    <div class="bar" id="bar"><div id="fill"></div></div>
    <div id="log"></div>
    <div id="result"></div>

    <div class="note">
      This is a joke. It can't reveal real passwords and sends nothing anywhere.
      The "result" is randomly generated.
    </div>
  </div>

<script>
  const steps = [
    "Bypassing firewall...",
    "Injecting totally real exploit...",
    "Decrypting 4096-bit nonsense...",
    "Asking the dots politely...",
    "Reversing the asterisks..."
  ];
  const jokes = ["hunter2", "password123", "ilovepizza", "letmein", "qwerty", "12345678", "correcthorsebatterystaple", "notyourpassword"];

  function fakePassword() {
    if (Math.random() < 0.5) return jokes[Math.floor(Math.random() * jokes.length)];
    const chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%";
    let out = "";
    for (let i = 0; i < 10; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  const go = document.getElementById("go");
  const bar = document.getElementById("bar");
  const fill = document.getElementById("fill");
  const log = document.getElementById("log");
  const result = document.getElementById("result");

  go.addEventListener("click", () => {
    go.disabled = true;
    result.style.display = "none";
    bar.style.display = "block";
    let i = 0;
    const tick = setInterval(() => {
      fill.style.width = ((i + 1) / steps.length * 100) + "%";
      log.textContent = steps[i];
      i++;
      if (i >= steps.length) {
        clearInterval(tick);
        setTimeout(() => {
          log.textContent = "Success! (lol)";
          result.textContent = fakePassword();
          result.style.display = "block";
          go.disabled = false;
          fill.style.width = "0";
          bar.style.display = "none";
        }, 500);
      }
    }, 700);
  });
</script>
</body>
</html>
